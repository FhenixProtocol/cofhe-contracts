# Foundry is used only for the gas tests in test/foundry; Hardhat stays the main toolchain.
[profile.default]
src = "test/foundry"
test = "test/foundry"
out = "out-foundry"
cache_path = "cache-foundry"
libs = ["node_modules"]
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800 # same as hardhat.config.ts
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@fhenixprotocol/cofhe-contracts/=node_modules/@fhenixprotocol/cofhe-contracts/",
]
