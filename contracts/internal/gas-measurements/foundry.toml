[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "../host-chain/node_modules"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 800
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
isolate = true
fs_permissions = [{ access = "read-write", path = "./results" }, { access = "read", path = "../../FHE.sol" }]
allow_paths = ["../../", "../host-chain"]

# Public RPCs rate-limit a 300-call fork run; retries turn their errors into waits.
# Arbitrum needs an RPC that keeps a few thousand blocks of state (~250 ms blocks): the
# publicnode endpoint prunes too fast, sepolia-rollup.arbitrum.io/rpc works.
[rpc_endpoints]
sepolia = { endpoint = "${SEPOLIA_RPC_URL}", retries = 10, retry_backoff = 2000, compute_units_per_second = 100 }
arbitrumSepolia = { endpoint = "${ARBITRUM_SEPOLIA_RPC_URL}", retries = 10, retry_backoff = 2000, compute_units_per_second = 100 }
