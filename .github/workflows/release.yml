# Publishes @fhenixprotocol/cofhe-contracts when a version bump lands on master, the way cofhesdk's
# "Version Packages" PR does for the SDK: merging the bump is the release. The job publishes the
# package to npm and creates the GitHub release and tag; there is no release to create by hand.
name: Publish Cofhe Contracts Package to npmjs
on:
  push:
    branches: [master]
    paths: [contracts/package.json]
  workflow_dispatch:

permissions:
  contents: write # creates the GitHub release and its tag
  id-token: write # Required for NPM OIDC trusted publishing

concurrency:
  group: publish-cofhe-contracts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x # Node 22 for npm 11.x (OIDC requires npm >= 11.5)
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false
      - name: Install deps
        run: cd contracts && pnpm install

      - name: Read package version
        run: |
          echo "VERSION=$(jq -r .version < ./contracts/package.json)" >> $GITHUB_ENV
          echo "NAME=$(jq -r .name < ./contracts/package.json)" >> $GITHUB_ENV

      # A push that leaves the version as it is (or re-running by hand) must not republish.
      - name: Is this version on npm already?
        run: |
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is on npm already; nothing to publish."
            echo "PUBLISHED=true" >> $GITHUB_ENV
          else
            echo "PUBLISHED=false" >> $GITHUB_ENV
          fi

      - name: Determine prerelease tag
        if: env.PUBLISHED == 'false'
        run: |
          if [[ "${VERSION}" =~ \-(alpha|beta)\.[0-9]+$ ]]; then
            echo "PRERELEASE=--tag beta" >> $GITHUB_ENV
            echo "GH_PRERELEASE=--prerelease" >> $GITHUB_ENV
          else
            echo "PRERELEASE=" >> $GITHUB_ENV
            echo "GH_PRERELEASE=" >> $GITHUB_ENV
          fi

      - name: Publish to npm
        if: env.PUBLISHED == 'false'
        run: cd contracts && pnpm publish --no-git-checks ${{ env.PRERELEASE }}

      # The tag may already exist when a release was created by hand before the bump landed; the
      # package is published either way, and the existing release is left as it is.
      - name: Create the GitHub release
        if: env.PUBLISHED == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Release v${VERSION} exists already; not creating another."
          else
            gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --generate-notes ${{ env.GH_PRERELEASE }}
          fi
